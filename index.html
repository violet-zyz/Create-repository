<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>外出报备 · 本地演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:560px;margin:auto;background:#fff;min-height:100vh}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #eee;padding:22px 16px 14px;text-align:center;font-size:22px}.top button{float:right}.notice{font-size:12px;color:#777;background:#fff8e9;text-align:center;padding:7px}.summary{padding:22px 18px;border-bottom:12px solid #f4f5f7}h2{margin:0;font-size:19px}#state{float:right;color:#79c910;font-size:14px}.muted{color:#999;font-size:13px;margin-top:19px}.fields{padding:18px}.field{margin:0 0 23px}.field label{display:block;font-size:17px;font-weight:650;margin-bottom:10px}.val{background:#f0f0f2;color:#555;border:1px solid #ddd;border-radius:7px;padding:12px 13px;min-height:44px;white-space:pre-wrap;overflow-wrap:anywhere}.bar{height:18px;background:#f4f5f7}.heading{font-size:21px;padding:18px;border-bottom:1px solid #ddd}.steps{padding:20px 18px 50px}.step{border-left:2px solid #ddd;margin-left:22px;padding:0 0 32px 35px;position:relative}.dot{position:absolute;left:-23px;top:0;background:#0078df;color:white;border-radius:50%;height:44px;width:44px;display:grid;place-items:center}.step b{font-size:17px}.step small{color:#aaa;display:block;margin:8px 0}.green{color:#7bc900}.action{padding:20px}.btn{background:#0798f9;color:white;border:0;border-radius:6px;padding:12px 22px;cursor:pointer}.wide{width:100%}.comments{min-height:115px;display:grid;place-items:center;color:#aaa}.logs{padding:18px}.log{margin:10px 0 18px;border-radius:12px;box-shadow:0 3px 13px #0001;padding:18px;line-height:1.9}.edit{position:fixed;z-index:5;bottom:20px;right:18px}.sheet{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:end;justify-content:center}.sheet.show{display:flex}.panel{background:#fff;border-radius:16px 16px 0 0;width:min(100%,560px);max-height:93dvh;display:flex;flex-direction:column}.panel h3{margin:0;padding:15px;border-bottom:1px solid #ddd}.scroll{overflow-y:auto;padding:16px}.entry{margin:0 0 15px}.entry label{display:block;font-size:13px;margin-bottom:5px;color:#555}.entry input,.entry textarea{width:100%;border:1px solid #ddd;border-radius:7px;padding:10px;font-size:16px}.entry textarea{min-height:75px}.actions{display:flex;gap:8px;padding:12px}.actions button{flex:1}.secondary{background:#f1f1f1;border:0;border-radius:7px;padding:10px}.tip{font-size:12px;color:#777}</style><style>

</style></head><body><main><div class="top">详情 <button onclick="edit()" class="secondary">编辑</button></div><div class="notice">个人演示页面 · 非学校官方审批凭证</div><section class="summary"><div id="state"></div><h2 id="title"></h2><div class="muted" id="person"></div></section><div class="fields" id="fields"></div><div class="bar"></div><div class="heading">流程</div><div class="timeline" id="steps"></div><div class="action"><button class="btn wide" onclick="changeState()">撤销（仅演示）</button></div><div class="bar"></div><div class="heading">评论 <button class="secondary" style="float:right" onclick="comment()">＋</button></div><div id="comments" class="comments"></div><div class="bar"></div><div class="heading">数据日志</div><div class="logs" id="logs"></div></main><button class="btn edit" onclick="edit()">✎ 编辑所有数据</button><div class="sheet" id="sheet"><div class="panel"><h3>编辑所有数据 <button style="float:right" class="secondary" onclick="closeEdit()">✕</button></h3><div class="scroll" id="editor"></div><div class="actions"><button class="secondary" onclick="download()">导出</button><button class="secondary" onclick="document.getElementById('upload').click()">导入</button><button class="btn" onclick="save()">保存</button></div><input type="file" id="upload" accept="application/json" hidden onchange="importData(event)"></div></div><script>

'<div class="step"><div class="step-icon"><svg width="30" height="30" viewBox="0 0 32 32"><path fill="white" d="M2 15 29 4 21 28 15 19 2 15Zm12 1 5 5 5-12-10 7Z"/></svg><span class="tick">✓</span></div><div class="step-copy"><div class="step-top"><span class="step-name">'+esc(data.office)+'</span><span class="step-time">'+stamp+'</span></div><div class="step-desc">'+esc(data.officeNote)+' <span class="flow-arrow">⌄</span></div></div></div>';
document.getElementById('comments').innerHTML=data.comments.length?data.comments.map((x,i)=>'<div class="log">'+esc(x)+' <button class="secondary" onclick="removeComment('+i+')">删除</button></div>').join(''):'暂无评论';document.getElementById('logs').innerHTML='<div class="log"><div class="log-top"><img src="'+esc(data.approverAvatar)+'"><span class="log-name">'+esc(data.approver)+'</span><span class="log-verb">处理</span><span>了这条数据</span><span class="log-date">'+esc(data.approvedTime)+'</span></div><div class="log-detail">进行了 '+esc(data.approvalResult)+' 操作</div></div><div class="log"><div class="log-top"><img src="'+esc(data.avatar)+'"><span class="log-name">'+esc(data.name)+'</span><span class="log-verb">创建</span><span>了这条数据</span><span class="log-date">'+esc(data.createdTime)+'</span></div></div>'+data.extraLogs.map((x,i)=>'<div class="log"><div class="log-top">'+esc(x)+' <button class="secondary" onclick="removeLog('+i+')">删除</button></div></div>').join('')+'<button class="secondary" onclick="addLog()">添加日志</button>'}function edit(){document.getElementById('editor').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="entry"><label>'+esc(v)+'</label><textarea data-key="'+k+'">'+esc(data[k])+'</textarea></div>').join('')+'<p class="tip">数据仅保存在此设备浏览器，清除浏览器数据可能丢失。</p>';document.getElementById('sheet').classList.add('show')}function closeEdit(){document.getElementById('sheet').classList.remove('show')}function save(){document.querySelectorAll('[data-key]').forEach(e=>data[e.dataset.key]=e.value);persist();render();closeEdit()}function comment(){let x=prompt('输入评论');if(x){data.comments.push(x);persist();render()}}function removeComment(i){data.comments.splice(i,1);persist();render()}function addLog(){let x=prompt('添加日志内容');if(x){data.extraLogs.push(x);persist();render()}}function removeLog(i){data.extraLogs.splice(i,1);persist();render()}function changeState(){if(confirm('仅在本机演示中修改为已撤销？')){data.status='已撤销';persist();render()}}function download(){let a=document.crea
