let data;try{data={...defaults,...JSON.parse(localStorage.getItem('leaveWebsiteData_v3')||'{}')}}catch(e){data={...defaults}}let draft=null;let currentTab='basic';let logsVisible=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=()=>esc(data.avatar||AVATAR);const persist=()=>localStorage.setItem('leaveWebsiteData_v3',JSON.stringify(data));
function render(){document.title=data.title+' - 详情';document.getElementById('summaryTitle').textContent=data.title;document.getElementById('approval').textContent='['+data.status+']';document.getElementById('personName').textContent=data.name;document.getElementById('personSub').textContent=data.studentId+'  学生\\'+data.college+'\\'+data.major;document.getElementById('av1').src=data.avatar||AVATAR;
document.getElementById('fields').innerHTML=fields.map(([key,label,kind])=>`<div class="field"><div class="field-title">${kind===1?'<span class="required">*</span>':''}${label}</div><div class="field-value ${kind==='name'?'namefield':''}">${kind==='name'?`<span class="namechip"><img src="${img()}" class="avatar" style="width:25px;height:25px">${esc(data[key])}</span>`:esc(data[key])}</div></div>`).join('')+'<div class="tip" style="text-align:right">　</div>';
const stamp=esc(data.approvalTime);document.getElementById('timeline').innerHTML=`<div class="step"><div class="step-icon user"><img src="${img()}"><span class="tick">✓</span></div><div class="step-body"><div class="step-top"><span class="step-name">发起申请</span><span class="step-time">${stamp}</span></div><div class="step-desc">我</div></div></div><div class="step"><div class="step-icon"><svg width="29" height="29" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="5" fill="white"/><path d="M2 27 Q2 17 12 17 Q22 17 22 27Z" fill="white"/><circle cx="24" cy="12" r="4" fill="white"/><path d="M22 18Q30 17 30 27H24Z" fill="white"/></svg><span class="tick">✓</span></div><div class="step-body"><div class="step-top"><span class="step-name">辅导员</span><span class="step-time">${stamp}</span></div><div class="step-desc">辅导员角色或签 <span class="green">${esc(data.approvalAction)}</span></div><div class="substep"><img class="sub-avatar" src="${APPROVER_AVATAR}" alt="辅导员头像"><div><div class="sub-name">${esc(data.approver)}</div><div class="green">${esc(data.approvalAction)}</div></div></div></div></div>${data.showOffice==='是'?`<div class="step"><div class="step-icon">➤<span class="tick">✓</span></div><div class="step-body"><div class="step-top"><span class="step-name">${esc(data.office)}</span><span class="step-time">${stamp}</span></div><div class="step-desc">${esc(data.officeNote||('抄送'+data.otherRecipients+'人，已读'+data.readRecipients+'人'))}</div></div></div>`:''}`;
document.getElementById('withdraw').textContent=data.status==='已撤销'?'已撤销':'撤销';document.getElementById('comments').innerHTML=data.comments.length?data.comments.map((c,i)=>`<div class="comment-item"><b>${esc(c.author)}</b>　<span style="color:#999">${esc(c.time)}</span><div style="margin-top:8px">${esc(c.text)}</div><button class="small-btn" onclick="deleteComment(${i})">删除</button></div>`).join(''):'<div class="comment-empty">暂无评论</div>';
document.getElementById('logs').innerHTML=logsVisible?`<div class="log"><div class="log-top"><img class="log-approver" src="${APPROVER_AVATAR}" alt="辅导员头像"><span class="actor">${esc(data.approver)}</span><span class="verb">处理</span>了这条数据 <span class="at">${esc(data.approvedTime)}</span></div><div class="log-detail">进行了 ${esc(data.approvalAction)} 操作</div></div><div class="log"><div class="log-top"><img src="${img()}"><span class="actor">${esc(data.name)}</span><span class="verb">创建</span>了这条数据 <span class="at">${esc(data.createdTime)}</span></div></div>${data.extraLogs.map((x,i)=>`<div class="log"><div class="log-top"><span class="actor">${esc(x.actor)}</span><span class="verb">${esc(x.action)}</span><span class="at">${esc(x.time)}</span></div><div class="log-detail">${esc(x.detail)}</div><button class="small-btn" onclick="removeLog(${i})">删除该日志</button></div>`).join('')}`:'';}
function toggleLogs(){logsVisible=!logsVisible;render()}function withdrawApp(){if(confirm('确定要撤销这条申请吗？')){data.status='已撤销';persist();render()}}function addComment(){let t=prompt('填写评论内容');if(t?.trim()){data.comments.push({author:data.name,time:new Date().toLocaleString('zh-CN'),text:t.trim()});persist();render()}}function deleteComment(i){if(confirm('删除这条评论？')){data.comments.splice(i,1);persist();render()}}function removeLog(i){data.extraLogs.splice(i,1);persist();render()}
const tabs=[['basic','申请信息'],['flow','流程与状态'],['logs','日志与评论']];function openEditor(){draft=JSON.parse(JSON.stringify(data));currentTab='basic';document.getElementById('editor').classList.add('open');renderEditor()}function closeEditor(){document.getElementById('editor').classList.remove('open')}
function inputRow(key,label){let value=draft[key]??'';let long=['reason','avatar','officeNote'].includes(key);let options=['offCampus','outCity','outProvince','hasClass','showOffice'].includes(key)?['是','否']:key==='status'?['已通过','审批中','未通过','已撤销']:key==='approvalAction'?['同意','拒绝','待审批']:null;return `<div class="edit-row"><label for="edit-${key}">${esc(label)}</label>${options?`<select id="edit-${key}" data-key="${key}">${[...new Set([...options,String(value)])].map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:long?`<textarea id="edit-${key}" data-key="${key}">${esc(value)}</textarea>`:`<input id="edit-${key}" data-key="${key}" value="${esc(value)}">`}</div>`}
function syncInputs(){document.querySelectorAll('#editContent [data-key]').forEach(x=>draft[x.dataset.key]=x.value)}function renderEditor(){document.getElementById('tabs').innerHTML=tabs.map(([id,n])=>`<button onclick="changeTab('${id}')" class="${currentTab===id?'active':''}">${n}</button>`).join('');let content='';if(currentTab==='basic')content=fields.map(([k,n])=>inputRow(k,n)).join('');if(currentTab==='flow')content=extras.map(([k,n])=>inputRow(k,n)).join('')+'<p class="tip">状态、审批人、抄送节点、日志时间均可修改。头像可以使用图片链接或上传本地图片。</p><input type="file" id="avfile" accept="image/*" onchange="loadAvatar(event)">';if(currentTab==='logs')content=`<h3>自定义数据日志</h3><div id="extraLogEditor">${draft.extraLogs.map((l,i)=>`<div style="border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:9px">${[['actor','处理人'],['action','操作'],['time','时间'],['detail','详情']].map(([k,n])=>`<div class="edit-row"><label>${n}</label><input data-logidx="${i}" data-logkey="${k}" value="${esc(l[k])}"></div>`).join('')}<button class="small-btn" onclick="delDraftLog(${i})">删除</button></div>`).join('')}</div><button class="small-btn" onclick="addDraftLog()">＋ 添加日志</button><h3>评论（JSON 格式）</h3><textarea id="commentsJson" style="width:100%;height:140px;border:1px solid #ddd;border-radius:8px;padding:10px">${esc(JSON.stringify(draft.comments,null,2))}</textarea><p class="tip">评论格式：[ { "author": "名字", "time": "时间", "text": "内容" } ]</p>`;document.getElementById('editContent').innerHTML=content}
function syncTab(){syncInputs();if(currentTab==='logs'){document.querySelectorAll('[data-logidx]').forEach(el=>draft.extraLogs[+el.dataset.logidx][el.dataset.logkey]=el.value);try{let j=JSON.parse(document.getElementById('commentsJson').value);if(Array.isArray(j))draft.comments=j}catch(e){}}}function changeTab(t){syncTab();currentTab=t;renderEditor()}function addDraftLog(){syncTab();draft.extraLogs.push({actor:'',action:'',time:'',detail:''});renderEditor()}function delDraftLog(i){syncTab();draft.extraLogs.splice(i,1);renderEditor()}
function saveEditor(){syncTab();data={...draft};persist();render();closeEditor()}function resetAll(){if(confirm('恢复最初截图中的所有默认数据？')){data=JSON.parse(JSON.stringify(defaults));persist();render();closeEditor()}}function loadAvatar(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{draft.avatar=r.result;};r.readAsDataURL(f)}
function exportJson(){syncTab();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.download='外出报备申请数据.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importJson(e){let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('格式错误');draft={...defaults,...obj};if(!Array.isArray(draft.comments))draft.comments=[];if(!Array.isArray(draft.extraLogs))draft.extraLogs=[];renderEditor();alert('已导入，请点击“保存修改”')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(f)}
render();
</script></body></html>
