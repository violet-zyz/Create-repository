<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>外出报备 · 本地演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:560px;margin:auto;background:#fff;min-height:100vh}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #eee;padding:22px 16px 14px;text-align:center;font-size:22px}.top button{float:right}.notice{font-size:12px;color:#777;background:#fff8e9;text-align:center;padding:7px}.summary{padding:22px 18px;border-bottom:12px solid #f4f5f7}h2{margin:0;font-size:19px}#state{float:right;color:#79c910;font-size:14px}.muted{color:#999;font-size:13px;margin-top:19px}.fields{padding:18px}.field{margin:0 0 23px}.field label{display:block;font-size:17px;font-weight:650;margin-bottom:10px}.val{background:#f0f0f2;color:#555;border:1px solid #ddd;border-radius:7px;padding:12px 13px;min-height:44px;white-space:pre-wrap;overflow-wrap:anywhere}.bar{height:18px;background:#f4f5f7}.heading{font-size:21px;padding:18px;border-bottom:1px solid #ddd}.steps{padding:20px 18px 50px}.step{border-left:2px solid #ddd;margin-left:22px;padding:0 0 32px 35px;position:relative}.dot{position:absolute;left:-23px;top:0;background:#0078df;color:white;border-radius:50%;height:44px;width:44px;display:grid;place-items:center}.step b{font-size:17px}.step small{color:#aaa;display:block;margin:8px 0}.green{color:#7bc900}.action{padding:20px}.btn{background:#0798f9;color:white;border:0;border-radius:6px;padding:12px 22px;cursor:pointer}.wide{width:100%}.comments{min-height:115px;display:grid;place-items:center;color:#aaa}.logs{padding:18px}.log{margin:10px 0 18px;border-radius:12px;box-shadow:0 3px 13px #0001;padding:18px;line-height:1.9}.edit{position:fixed;z-index:5;bottom:20px;right:18px}.sheet{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:end;justify-content:center}.sheet.show{display:flex}.panel{background:#fff;border-radius:16px 16px 0 0;width:min(100%,560px);max-height:93dvh;display:flex;flex-direction:column}.panel h3{margin:0;padding:15px;border-bottom:1px solid #ddd}.scroll{overflow-y:auto;padding:16px}.entry{margin:0 0 15px}.entry label{display:block;font-size:13px;margin-bottom:5px;color:#555}.entry input,.entry textarea{width:100%;border:1px solid #ddd;border-radius:7px;padding:10px;font-size:16px}.entry textarea{min-height:75px}.actions{display:flex;gap:8px;padding:12px}.actions button{flex:1}.secondary{background:#f1f1f1;border:0;border-radius:7px;padding:10px}.tip{font-size:12px;color:#777}</style></head><body><main><div class="top">详情 <button onclick="edit()" class="secondary">编辑</button></div><div class="notice">个人演示页面 · 非学校官方审批凭证</div><section class="summary"><div id="state"></div><h2 id="title"></h2><div class="muted" id="person"></div></section><div class="fields" id="fields"></div><div class="bar"></div><div class="heading">流程</div><div class="steps" id="steps"></div><div class="action"><button class="btn wide" onclick="changeState()">撤销（仅演示）</button></div><div class="bar"></div><div class="heading">评论 <button class="secondary" style="float:right" onclick="comment()">＋</button></div><div id="comments" class="comments"></div><div class="bar"></div><div class="heading">数据日志</div><div class="logs" id="logs"></div></main><button class="btn edit" onclick="edit()">✎ 编辑所有数据</button><div class="sheet" id="sheet"><div class="panel"><h3>编辑所有数据 <button style="float:right" class="secondary" onclick="closeEdit()">✕</button></h3><div class="scroll" id="editor"></div><div class="actions"><button class="secondary" onclick="download()">导出</button><button class="secondary" onclick="document.getElementById('upload').click()">导入</button><button class="btn" onclick="save()">保存</button></div><input type="file" id="upload" accept="application/json" hidden onchange="importData(event)"></div></div><script>
const labels={number:'编号',name:'姓名',idCard:'身份证号',studentId:'学号',college:'院系',major:'专业',className:'班级',counselor:'辅导员姓名',counselorId:'辅导员工号',type:'外出类型',reason:'具体事由',offCampus:'是否出校',outCity:'是否出市',outProvince:'是否出省',hasClass:'是否有课',start:'外出开始时间',end:'外出结束时间',duration:'外出时长（天）',applyTime:'外出申请时间',status:'审批状态',approver:'审批人',approvalResult:'审批结果',approvalTime:'审批时间',office:'通知部门',officeNote:'通知状态',createdTime:'创建日志时间',approvedTime:'处理日志时间',title:'申请标题'};const defaults={title:'示例学生的外出报备申请',status:'已通过',name:'示例学生',number:'000000001',idCard:'示例信息（请自行编辑）',studentId:'2026000000',college:'示例学院',major:'计算机科学与技术',className:'计算机示例班',counselor:'示例辅导员',counselorId:'T000',type:'事假',reason:'个人事务（示例内容）',offCampus:'是',outCity:'是',outProvince:'否',hasClass:'是',start:'2026-10-14 14:00',end:'2026-10-16 17:30',duration:'2.1',applyTime:'2026-10-14 12:51',approver:'示例辅导员',approvalResult:'同意',approvalTime:'2026-10-14 12:52',office:'学工处',officeNote:'抄送2人，已读0人',createdTime:'2026-10-14 12:52:27',approvedTime:'2026-10-14 12:52:41',comments:[],extraLogs:[]};let data;try{data={...defaults,...JSON.parse(localStorage.getItem('leave-demo-v2')||'{}')}}catch{data={...defaults}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('leave-demo-v2',JSON.stringify(data))}function render(){document.getElementById('title').textContent=data.title;document.getElementById('state').textContent='['+data.status+']';document.getElementById('person').textContent=data.name+'  '+data.studentId+'  学生\\'+data.college+'\\'+data.major;document.getElementById('fields').innerHTML=Object.entries(labels).filter(([k])=>!['title','status','approver','approvalResult','approvalTime','office','officeNote','createdTime','approvedTime'].includes(k)).map(([k,v])=>'<div class="field"><label>'+esc(v)+'</label><div class="val">'+esc(data[k])+'</div></div>').join('');document.getElementById('steps').innerHTML=[['✓','发起申请',data.name,data.approvalTime],['✓','辅导员',data.approver+' · '+data.approvalResult,data.approvalTime],['➤',data.office,data.officeNote,data.approvalTime]].map(x=>'<div class="step"><span class="dot">'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><small>'+esc(x[3])+'</small><span class="green">'+esc(x[2])+'</span></div>').join('');document.getElementById('comments').innerHTML=data.comments.length?data.comments.map((x,i)=>'<div class="log">'+esc(x)+' <button class="secondary" onclick="removeComment('+i+')">删除</button></div>').join(''):'暂无评论';document.getElementById('logs').innerHTML='<div class="log">'+esc(data.approver)+' 处理了这条数据<br>'+esc(data.approvedTime)+'<hr>进行了 '+esc(data.approvalResult)+' 操作</div><div class="log">'+esc(data.name)+' 创建了这条数据<br>'+esc(data.createdTime)+'</div>'+data.extraLogs.map((x,i)=>'<div class="log">'+esc(x)+' <button onclick="removeLog('+i+')" class="secondary">删除</button></div>').join('')+'<button class="secondary" onclick="addLog()">添加日志</button>'}function edit(){document.getElementById('editor').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="entry"><label>'+esc(v)+'</label><textarea data-key="'+k+'">'+esc(data[k])+'</textarea></div>').join('')+'<p class="tip">数据仅保存在此设备浏览器，清除浏览器数据可能丢失。</p>';document.getElementById('sheet').classList.add('show')}function closeEdit(){document.getElementById('sheet').classList.remove('show')}function save(){document.querySelectorAll('[data-key]').forEach(e=>data[e.dataset.key]=e.value);persist();render();closeEdit()}function comment(){let x=prompt('输入评论');if(x){data.comments.push(x);persist();render()}}function removeComment(i){data.comments.splice(i,1);persist();render()}function addLog(){let x=prompt('添加日志内容');if(x){data.extraLogs.push(x);persist();render()}}function removeLog(i){data.extraLogs.splice(i,1);persist();render()}function changeState(){if(confirm('仅在本机演示中修改为已撤销？')){data.status='已撤销';persist();render()}}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='外出报备_本地数据.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{data={...defaults,...JSON.parse(t)};persist();render();closeEdit()}catch{alert('JSON 格式错误')}})}render();</script></body></html>
